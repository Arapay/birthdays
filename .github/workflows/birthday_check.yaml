name: Daily Birthday Reminder

on:
  schedule:
    # 每天 UTC 时间 00:00 运行（对应北京时间早上 08:00）
    # 注：GitHub Actions 的定时任务可能会有几分钟到半小时的延迟，属于正常现象
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许你在 GitHub 页面上手动点击按钮触发测试

jobs:
  check-and-remind:
    runs-on: ubuntu-latest

    steps:
    # 1. 拉取仓库代码
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. 设置 Python 环境
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 3. 运行脚本，并把保存的邮箱密匙注入到环境变量中
    - name: Run script
      env:
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        AUTH_CODE: ${{ secrets.AUTH_CODE }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
      run: python main.py